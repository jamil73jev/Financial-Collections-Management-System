name: Calidad y seguridad

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar datos sensibles, archivos prohibidos y enlaces
        run: python3 .github/scripts/verificar.py
