# ============================================================
# SIGECO — Backend FastAPI en Fly.io
# App: sigeco-backend
# Región: gru (São Paulo — misma región que MongoDB)
# ============================================================

app = "sigeco-backend"
primary_region = "gru"

[build]
  # Usa el Dockerfile existente en backend/
  dockerfile = "../../backend/Dockerfile"
  # O si se despliega desde la carpeta backend/:
  # dockerfile = "Dockerfile"

# Variables de entorno — los secretos se configuran con fly secrets set
[env]
  DB_NAME         = "Thunder"
  COL_CONTRIB     = "Base1,5"
  PORT            = "8000"
  JWT_EXPIRE_HOURS = "8"
  CAMPANA_LIMITE  = "50000"
  # MONGO_URI     → fly secrets set MONGO_URI="mongodb://sigeco_app:PASSWORD@sigeco-mongo.internal:27017/Thunder?authSource=admin"
  # JWT_SECRET    → fly secrets set JWT_SECRET="tu-clave-secreta-minimo-32-caracteres"
  # CORS_ORIGINS  → fly secrets set CORS_ORIGINS="https://sigeco-mvp.netlify.app"

# Máquina compartida (free tier)
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Servicio HTTP público
[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval     = "30s"
    timeout      = "10s"
    grace_period = "15s"
    method       = "get"
    path         = "/api/health"
