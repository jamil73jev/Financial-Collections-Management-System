# Configuración MongoDB optimizada para Fly.io free tier
# Reduce uso de memoria y disco para el plan gratuito

storage:
  wiredTiger:
    engineConfig:
      # Limitar cache a 256 MB (en lugar del default 50% de RAM)
      # El free tier de Fly.io tiene 256 MB RAM total
      cacheSizeGB: 0.25

# Reducir verbosidad de logs
systemLog:
  verbosity: 0
  quiet: true
