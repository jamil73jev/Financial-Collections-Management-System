# ============================================================
# SIGECO MVP — Configuración de despliegue en Render.com
# ============================================================

services:
  # ── Backend principal (app completa) ──────────────────────
  - type: web
    name: sigeco-mvp
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: cd frontend-v2 && npm install && npm run build && cp -r dist ../backend/frontend && cd .. && pip install -r backend/requirements.txt
    startCommand: cd backend && python main.py
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_NAME
        value: Thunder
      - key: COL_CONTRIB
        value: "Base1,5"
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_EXPIRE_HOURS
        value: "8"
    healthCheckPath: /api/health
    autoDeploy: true

  # ── Microservicio para Google Apps Script ──────────────────
  - type: web
    name: sigeco-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install fastapi uvicorn pymongo
    startCommand: python sigeco_api.py
    envVars:
      - key: MONGO_URI
        sync: false          # Pegar: mongodb+srv://<USUARIO>:<PASSWORD>@<HOST>/Thunder
      - key: DB_NAME
        value: Thunder
      - key: COL_CONTRIB
        value: "Base1,5"
      - key: SIGECO_API_KEY
        sync: false          # Crear una clave secreta, ej: sigeco-gapps-2026
      - key: PORT
        value: "8001"
    healthCheckPath: /api/health
    autoDeploy: true
