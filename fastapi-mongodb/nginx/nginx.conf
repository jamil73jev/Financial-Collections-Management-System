# ============================================================
# SIGECO — Configuración Nginx
# Proxy inverso + HTTPS + Frontend estático
# ============================================================
# Certificado SSL:
#   - Institucional: colocar fullchain.pem y privkey.pem en nginx/ssl/
#   - Let's Encrypt: certbot --nginx -d sigeco.municipio.gob.ec
# ============================================================

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name sigeco.municipio.gob.ec;
    return 301 https://$host$request_uri;
}

# Servidor principal HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name sigeco.municipio.gob.ec;

    # ── Certificado SSL ──────────────────────────────────
    ssl_certificate     /etc/ssl/sigeco/fullchain.pem;
    ssl_certificate_key /etc/ssl/sigeco/privkey.pem;

    # Protocolos y cifrados seguros
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Headers de seguridad ─────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';"
        always;

    # ── Frontend estático ────────────────────────────────
    root /var/www/sigeco;
    index login.html;

    # Servir index.html como SPA (sin hash routing)
    location / {
        try_files $uri $uri/ /login.html;
    }

    # Cache de assets estáticos (Chart.js se carga desde CDN, pero por si acaso)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── API Proxy → Backend FastAPI ──────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts para operaciones pesadas (morosidad 442K docs)
        proxy_connect_timeout  30s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;

        # Tamaño máximo de request (importación de archivos Fase 2)
        client_max_body_size 50M;
    }

    # Swagger UI (solo accesible desde red interna)
    location /docs {
        # Descomentar para restringir por IP:
        # allow 192.168.1.0/24;
        # deny all;
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # ── Logs ─────────────────────────────────────────────
    access_log /var/log/nginx/sigeco_access.log;
    error_log  /var/log/nginx/sigeco_error.log  warn;
}
