# ============================================================
# SIGECO — Frontend React en Netlify
# ============================================================

[build]
  command   = "npm run build"
  publish   = "dist"
  base      = "."

[build.environment]
  NODE_VERSION = "20"
  # VITE_API_URL → configurar en Netlify Dashboard > Site settings > Environment variables
  # Ejemplo: VITE_API_URL=https://sigeco-backend.fly.dev

# Redirige todas las rutas al index.html para que React Router funcione
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
